<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="loaderTitle loaderDesc">
  <title id="loaderTitle">Dwellio loading</title>
  <desc id="loaderDesc">Orbiting teal dots around the Dwellio logo.</desc>
  <defs>
    <filter id="dotGlow" x="-250%" y="-250%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.184 0 0 0 0 0.620 0 0 0 0 0.455 0 0 0 .72 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .orbit{transform-origin:160px 160px;animation:dwellio-orbit 1.35s linear infinite}
      .logo{transform-origin:160px 160px;animation:dwellio-breathe 1.35s ease-in-out infinite}
      @keyframes dwellio-orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
      @keyframes dwellio-breathe{0%,100%{transform:scale(.985);opacity:.96}50%{transform:scale(1);opacity:1}}
      @media (prefers-reduced-motion:reduce){.orbit,.logo{animation:none}}
    </style>
  </defs>
  <circle cx="160" cy="160" r="132" fill="none" stroke="#2F9E74" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 10" opacity=".32"/>
  <g class="orbit">
    <circle cx="160" cy="28" r="8.5" fill="#2F9E74" filter="url(#dotGlow)"/>
    <circle cx="292" cy="160" r="6.5" fill="#2F9E74" opacity=".72"/>
    <circle cx="160" cy="292" r="5.5" fill="#2F9E74" opacity=".48"/>
    <circle cx="28" cy="160" r="4.5" fill="#2F9E74" opacity=".28"/>
  </g>
  <g class="logo">
    <path d="M96 164v-31a19 19 0 0 1 6-14l46-41a18 18 0 0 1 24 0l46 41a19 19 0 0 1 6 14v31" fill="none" stroke="#43AA98" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#43AA98">
      <rect x="143" y="135" width="15" height="15" rx="3"/><rect x="162" y="135" width="15" height="15" rx="3"/>
      <rect x="143" y="154" width="15" height="15" rx="3"/><rect x="162" y="154" width="15" height="15" rx="3"/>
    </g>
    <rect x="89" y="166" width="75" height="69" rx="18" fill="#293441"/>
    <g fill="#fff">
      <circle cx="103" cy="191" r="4.8"/><circle cx="103" cy="205" r="4.8"/><circle cx="103" cy="219" r="4.8"/>
      <rect x="112" y="187" width="32" height="7" rx="3.5"/><rect x="112" y="201" width="32" height="7" rx="3.5"/><rect x="112" y="215" width="32" height="7" rx="3.5"/>
    </g>
    <path d="M163 166h50a18 18 0 0 1 18 18v33a18 18 0 0 1-18 18h-50z" fill="#43AA98"/>
    <path d="m179 202 13 13 25-27" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
